<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-коди станцій — Врятуй школу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px 60px;
    font-family: "Fredoka", "Segoe UI", sans-serif;
    color: #1d1a33;
    background: #f4f2fb;
  }

  h1 {
    text-align: center;
    font-size: 1.7rem;
    margin: 0 0 6px;
  }

  .sub {
    text-align: center;
    color: rgba(29, 26, 51, 0.6);
    margin: 0 0 28px;
    font-size: 0.98rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border: 1px solid #e6e1f7;
    border-radius: 22px;
    padding: 22px 18px 18px;
    text-align: center;
    box-shadow: 0 14px 30px -20px rgba(40, 20, 90, 0.45);
    break-inside: avoid;
  }

  .icon { font-size: 1.9rem; line-height: 1; }

  .title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 8px 0 14px;
    line-height: 1.3;
  }

  .qr {
    display: flex;
    justify-content: center;
    padding: 10px;
    background: #fff;
    border-radius: 14px;
  }

  .qr img, .qr canvas { display: block; }

  .url {
    margin: 12px 0 0;
    font-size: 0.72rem;
    color: rgba(29, 26, 51, 0.55);
    word-break: break-all;
    line-height: 1.4;
  }

  .hint {
    max-width: 1100px;
    margin: 26px auto 0;
    padding: 16px 18px;
    border-radius: 16px;
    background: #ece7fb;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .hint { display: none; }
    .card { box-shadow: none; page-break-inside: avoid; }
    .grid { gap: 14px; }
  }
</style>
</head>
<body>

<h1>QR-коди станцій</h1>
<p class="sub">Врятуй школу — операція проти MATH_BUG.exe</p>

<div class="grid" id="grid"></div>

<p class="hint">Роздрукуйте цю сторінку й наклейте кожен QR-код на відповідну картку станції. Коди ведуть на цей самий сайт — команда сканує код і вводить відповідь.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const STATIONS = [
    { stage: 1, icon: "🐞", title: "Станція 1. Знайди SUS" },
    { stage: 2, icon: "⚡", title: "Станція 2. Не стань NPC" },
    { stage: 3, icon: "⛏️", title: "Станція 3. Minecraft: врятуй базу" },
    { stage: 4, icon: "🐱", title: "Станція 4. Мемний шифр" },
    { stage: 5, icon: "👾", title: "Фінальний рівень. Boss Fight" },
  ];

  const base = new URL(".", location.href).href;
  const grid = document.getElementById("grid");

  STATIONS.forEach(({ stage, icon, title }) => {
    const url = `${base}?stage=${stage}`;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="icon">${icon}</div>
      <div class="title">${title}</div>
      <div class="qr"></div>
      <p class="url">${url}</p>
    `;
    grid.appendChild(card);

    new QRCode(card.querySelector(".qr"), {
      text: url,
      width: 200,
      height: 200,
      correctLevel: QRCode.CorrectLevel.M,
    });
  });
</script>
</body>
</html>
