<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Картки станцій — Врятуй школу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Fredoka", "Segoe UI", sans-serif;
    color: #1d1a33;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page {
    width: 210mm;
    height: 297mm;
    display: flex;
    align-items: center;
    justify-content: center;
    page-break-after: always;
  }

  .page:last-child { page-break-after: auto; }

  .card {
    width: 148mm;
    height: 210mm;
    padding: 12mm 11mm 10mm;
    border: 0.5mm dashed #c9bff0;
    border-radius: 5mm;
    display: flex;
    flex-direction: column;
  }

  /* ---------- лицьовий бік ---------- */

  .station {
    font-size: 3mm;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #7c5cff;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 4.5mm;
    margin-top: 4mm;
  }

  .icon {
    flex-shrink: 0;
    width: 16mm;
    height: 16mm;
    display: grid;
    place-items: center;
    border-radius: 5mm;
    background: #efe9ff;
    font-size: 9mm;
    line-height: 1;
  }

  h1 {
    margin: 0;
    font-size: 8.6mm;
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.015em;
  }

  .lead {
    margin: 6mm 0 0;
    font-size: 4.4mm;
    line-height: 1.4;
    color: #3d3860;
  }

  .tasks {
    margin-top: 6mm;
    display: grid;
    gap: 2.6mm;
  }

  .tasks.two { grid-template-columns: 1fr 1fr; column-gap: 4mm; }

  .task {
    display: flex;
    align-items: baseline;
    gap: 3mm;
    padding: 3.2mm 4mm;
    border-radius: 2.5mm;
    background: #f5f2ff;
    font-size: 5.2mm;
    font-weight: 500;
  }

  .tasks.two .task { white-space: nowrap; font-size: 4.9mm; }

  .task .num {
    font-size: 3.6mm;
    font-weight: 700;
    color: #9a8bf0;
  }

  .line {
    display: inline-block;
    min-width: 13mm;
    border-bottom: 0.4mm solid #b7aae6;
    margin-left: 1.5mm;
  }

  .tasks.two .line { min-width: 9mm; }

  .block {
    margin-top: 6mm;
    padding: 4.5mm 5mm;
    border-radius: 3mm;
    background: #f5f2ff;
    border-left: 1.2mm solid #a992f5;
  }

  .block-label {
    font-size: 3.2mm;
    font-weight: 700;
    color: #7c5cff;
    margin-bottom: 2.5mm;
  }

  .block p { margin: 0; font-size: 4.3mm; line-height: 1.45; }
  .block p + p { margin-top: 2mm; }
  .block strong { font-weight: 700; }

  /* поля для запису відповіді */

  .bottom { margin-top: auto; padding-top: 7mm; }

  .answer-label {
    font-size: 3.2mm;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9a93b5;
    margin-bottom: 3.5mm;
  }

  .slots { display: flex; gap: 4mm; }

  .slot { display: flex; flex-direction: column; gap: 1.8mm; }

  .slot-box {
    height: 13mm;
    border: 0.5mm solid #cfc4f2;
    border-radius: 2.5mm;
    background: #fdfcff;
  }

  .slot.wide { flex: 1; }
  .slot.digit .slot-box { width: 14mm; }

  .slot-cap {
    font-size: 3.1mm;
    color: #6f6890;
    text-align: center;
  }

  /* ---------- зворот ---------- */

  .card.back {
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .back .icon { margin-bottom: 5mm; }

  .back .station { margin-bottom: 2mm; }

  .back h2 {
    margin: 0;
    font-size: 7.4mm;
    font-weight: 600;
    line-height: 1.15;
  }

  .back .qr { margin: 10mm 0 8mm; }

  .back .qr img, .back .qr canvas { display: block; }

  .back .scan {
    font-size: 4.6mm;
    font-weight: 600;
    line-height: 1.35;
    color: #3d3860;
  }
</style>
</head>
<body>

<div id="sheets"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const BASE = "https://krymskyimaksym.github.io/math-quest/";

  const STATIONS = [
    {
      stage: 1,
      station: "Станція 1",
      icon: "🐞",
      title: "Знайди SUS",
      lead: "Вірус пошкодив один рядок. Знайдіть його та виправте помилку.",
      tasks: ["48 : (8 − 2) = 8", "7 × (12 − 4) = 56", "90 − (24 : 6) = 86", "(35 + 13) : 6 = 7", "100 − (8 × 9) = 28"],
      numbered: true,
      block: { label: "Ще один приклад", html: "<p><strong>72 : (3 × 4) + 5 = 11</strong></p><p>Чи правильна ця рівність?</p>" },
      slots: [
        { cap: "№ виразу", digit: true },
        { cap: "правильна відповідь", wide: true },
      ],
    },
    {
      stage: 2,
      station: "Станція 2",
      icon: "⚡",
      title: "Не стань NPC",
      lead: "Порахуйте всі вісім прикладів. Швидко — і без помилок.",
      tasks: ["48 : 6 + 7 =", "6 × (9 − 4) =", "72 : (10 − 2) =", "100 − 8 × 7 =", "(36 + 24) : 6 =", "5 × 8 − 15 =", "120 : 4 + 25 =", "90 − (18 + 27) ="],
      numbered: true,
      columns: 2,
      withLines: true,
      block: { label: "Пастка", html: "<p><strong>А:</strong> 5 × 8 + 10 &nbsp;&nbsp;&nbsp; <strong>Б:</strong> 5 × (8 + 10)</p><p>Який вираз більший і на скільки?</p>" },
    },
    {
      stage: 3,
      station: "Станція 3",
      icon: "⛏️",
      title: "Minecraft: врятуй базу",
      lead: "База — прямокутник 12 × 7 блоків. Усередині кімната 4 × 3, у паркані прохід завширшки 2 блоки.",
      tasks: ["Периметр бази =", "Площа бази =", "Блоки паркану =", "Площа кімнати =", "Площа решти бази ="],
      numbered: true,
      withLines: true,
      block: { label: "Код скрині", html: "<p><strong>Площа бази − Периметр бази</strong></p><p>Запишіть код у маршрутний лист — він знадобиться у фіналі.</p>" },
    },
    {
      stage: 4,
      station: "Станція 4",
      icon: "🐱",
      title: "Мемний шифр",
      lead: "Знайдіть значення символів. Потім порахуйте вирази і візьміть останню цифру кожної відповіді.",
      tasks: ["Кіт + Кіт = 16", "Кіт + Піца = 13", "Моаї − Піца = 1", "Моаї + Прибулець = 10"],
      columns: 2,
      block: {
        label: "Порахуйте вирази",
        html: "<p><strong>1.</strong> Кіт × Прибулець − 4</p><p><strong>2.</strong> (Моаї + Піца) × Прибулець</p><p><strong>3.</strong> Кіт + Піца + Моаї + Прибулець + 4</p><p><strong>4.</strong> Піца × 2 − Прибулець + 1</p>",
      },
      slotsLabel: "Код доступу",
      slots: [
        { cap: "1", digit: true },
        { cap: "2", digit: true },
        { cap: "3", digit: true },
        { cap: "4", digit: true },
      ],
    },
    {
      stage: 5,
      station: "Фінал",
      icon: "👾",
      title: "Boss Fight",
      lead: "MATH_BUG.exe атакує ядро! Символи змінили значення — складіть фінальний код.",
      tasks: ["Кіт + Кіт = 20", "Кіт + Піца = 15", "Піца + Прибулець = 5"],
      block: {
        label: "Порахуйте",
        html: "<p><strong>Завдання 2:</strong> Кіт + Піца × Прибулець</p><p><strong>Завдання 3:</strong> (Кіт + Прибулець) × Піца − 15</p><p>Код: сотні з відповіді 3 · остання цифра відповіді 2 · значення прибульця</p>",
      },
      slotsLabel: "Фінальний код",
      slots: [
        { cap: "1", digit: true },
        { cap: "2", digit: true },
        { cap: "3", digit: true },
      ],
    },
  ];

  const sheets = document.getElementById("sheets");

  STATIONS.forEach((s) => {
    const url = `${BASE}?stage=${s.stage}`;

    const tasksHtml = s.tasks
      .map((t, i) => {
        const num = s.numbered ? `<span class="num">${String(i + 1).padStart(2, "0")}</span>` : "";
        const line = s.withLines ? '<span class="line"></span>' : "";
        return `<div class="task">${num}<span>${t}${line}</span></div>`;
      })
      .join("");

    const slotsHtml = s.slots
      ? `<div class="answer">
          <div class="answer-label">${s.slotsLabel || "Ваша відповідь"}</div>
          <div class="slots">
            ${s.slots
              .map(
                (sl) =>
                  `<div class="slot ${sl.wide ? "wide" : ""} ${sl.digit ? "digit" : ""}"><span class="slot-box"></span><span class="slot-cap">${sl.cap}</span></div>`
              )
              .join("")}
          </div>
        </div>`
      : "";

    const front = document.createElement("div");
    front.className = "page";
    front.innerHTML = `
      <div class="card">
        <div class="station">${s.station}</div>
        <div class="title-row">
          <div class="icon">${s.icon}</div>
          <h1>${s.title}</h1>
        </div>
        <p class="lead">${s.lead}</p>
        <div class="tasks ${s.columns === 2 ? "two" : ""}">${tasksHtml}</div>
        <div class="block">
          <div class="block-label">${s.block.label}</div>
          ${s.block.html}
        </div>
        <div class="bottom">${slotsHtml}</div>
      </div>
    `;
    sheets.appendChild(front);

    const back = document.createElement("div");
    back.className = "page";
    back.innerHTML = `
      <div class="card back">
        <div class="icon">${s.icon}</div>
        <div class="station">${s.station}</div>
        <h2>${s.title}</h2>
        <div class="qr"></div>
        <div class="scan">Відскануйте код,<br>щоб ввести відповіді</div>
      </div>
    `;
    sheets.appendChild(back);

    new QRCode(back.querySelector(".qr"), {
      text: url,
      width: 240,
      height: 240,
      correctLevel: QRCode.CorrectLevel.M,
    });
  });
</script>
</body>
</html>
